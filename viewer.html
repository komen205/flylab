<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlyBrain Live</title><style>body{background:#0b1116;color:#e6f1f5;font:16px system-ui;margin:24px auto;padding:0 16px;max-width:800px}h1{font-size:28px}img{width:100%;image-rendering:auto;border-radius:12px;background:#121e26;aspect-ratio:4/3}#status{color:#6aeac5}p{line-height:1.6;color:#acbec8}</style><h1>FlyBrain Live</h1><p id="status">Connecting…</p><img id="camera" alt="Bot’s simplified Minecraft camera"><p id="stats"></p><p>166,700 neurons · Training off<br>A simplified block camera driven by the fly brain simulation. The bot and feed require the host computer to stay awake.</p><script>
const token=location.hash.slice(1)||sessionStorage.getItem('feedToken');if(token){sessionStorage.setItem('feedToken',token);history.replaceState(null,'',location.pathname)}
async function update(){try{const r=await fetch('/snapshot',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();document.getElementById('camera').src=d.camera;document.getElementById('status').textContent=d.online?'● Live':'Paused';document.getElementById('stats').textContent=d.spikes.toLocaleString()+' spikes/step · '+d.computeMs+' ms compute · Frame '+d.frame;}catch{document.getElementById('status').textContent='Feed unavailable — reopen your private link or check that the host computer is awake.'}setTimeout(update,250)}update();
</script></html>
